name: pravo-app

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pravo}
      POSTGRES_USER: ${POSTGRES_USER:-pravo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pravo_local_dev}
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pravo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pravo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pravo_local_dev}
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data

# LLM/embeddings are NOT in compose: LM Studio serves them on the host (http://localhost:1234/v1) —
# GPU access is simpler there and the models are shared with its GUI. The api/spa/pipelines services
# are added later.

volumes:
  db_data:
  minio_data:
